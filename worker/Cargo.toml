[package]
name = "corely-worker"
version = "0.1.0"
edition = "2021"
description = "Corely remote worker agent"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4", "v5"] }
mac_address = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hostname = "0.4"
glob = "0.3"
walkdir = "2"
regex = "1"
dirs = "5"
anyhow = "1"
base64 = "0.22"

# System info
sysinfo = "0.32"

# Data collection
cpal = "0.15.2"
nokhwa = { version = "0.10", features = ["input-native"] }
notify = "6.0"
chrono = "0.4"
sha2 = "0.10"
tempfile = "3"

# Input simulation
enigo = { version = "0.2", features = ["serde"] }

# PTY support for terminal sessions
portable-pty = "0.8"
lazy_static = "1.4"

# Platform-specific
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.24"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.52"

[dev-dependencies]
tempfile = "3"

# Disable problematic features
[features]
default = []
